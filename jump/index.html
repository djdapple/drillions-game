<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRILLIONS MINI ARCADE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: system-ui, sans-serif;
      color: #8af3ff;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      margin-top: 40px;
      font-size: 32px;
      letter-spacing: 0.12em;
      text-shadow: 0 0 8px #00eaff;
    }

    .menu {
      width: 100%;
      max-width: 700px;
      margin: 50px auto;
      display: flex;
      justify-content: space-around;
      gap: 30px;
    }

    .game-card {
      width: 280px;
      height: 360px;
      background: #0d0d0d;
      border: 1px solid #2c2c2c;
      border-radius: 12px;
      box-shadow: 0 0 14px rgba(0, 230, 255, 0.3);
      text-align: center;
      padding: 20px;
      transition: 0.2s;
      cursor: pointer;
    }

    .game-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 22px rgba(0, 230, 255, 0.6);
    }

    .game-title {
      margin-top: 20px;
      font-size: 20px;
      letter-spacing: 0.08em;
      text-shadow: 0 0 6px #00eaff;
    }

    .thumb {
      width: 100%;
      height: 220px;
      border-radius: 8px;
      background-size: cover;
      background-position: center;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      opacity: 0.6;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <h1>DRILLIONS MINI ARCADE</h1>

  <div class="menu">

    <a href="/flappy/" style="text-decoration:none; color:inherit;">
      <div class="game-card">
        <div class="thumb" style="background-image:url('assets/flappy-thumb.png');"></div>
        <div class="game-title">FLAPPY DRILLIONS</div>
      </div>
    </a>

    <a href="/jump/" style="text-decoration:none; color:inherit;">
      <div class="game-card">
        <div class="thumb" style="background-image:url('assets/jump-thumb.png');"></div>
        <div class="game-title">DRILLIONS JUMP (Prototype)</div>
      </div>
    </a>

  </div>

  <div class="footer">© DRILLIONS ARCADE – 2026</div>

</body>
</html>
