<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DRILLIONS — CHROME MODE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background:#000; }
    canvas { width:100vw; height:100vh; display:block; touch-action:none; }

    #startScreen {
        position: absolute;
        top:0; left:0;
        width:100%; height:100%;
        background: rgba(0,0,0,0.8);
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        color:#8af3ff;
        font-family: system-ui, sans-serif;
        text-shadow: 0 0 8px #00eaff;
    }

    .btn {
        margin-top:20px;
        padding:14px 28px;
        border:2px solid #8af3ff;
        border-radius:8px;
        color:#8af3ff;
        font-size:20px;
        letter-spacing:1px;
        background:rgba(0,0,0,0.4);
        text-shadow:0 0 6px #00eaff;
    }

    #timer {
        position:fixed;
        top:12px;
        left:12px;
        font-size:18px;
        font-family: system-ui, sans-serif;
        color:#8af3ff;
        text-shadow:0 0 6px #00eaff;
        z-index:20;
    }

    #gameOver {
        position:absolute;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.7);
        display:none;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        color:#8af3ff;
        font-family: system-ui, sans-serif;
        text-shadow:0 0 6px #00eaff;
    }
</style>
</head>
<body>

<div id="timer">TIME: 0.0s</div>

<div id="startScreen">
    <h1>DRILLIONS — CHROME MODE</h1>
    <button class="btn" onclick="startGame()">START DRILLIONS</button>
</div>

<div id="gameOver">
    <h1>DRILLIONS DESTROYED</h1>
    <h2 id="finalTime"></h2>
    <button class="btn" onclick="restart()">RESTART</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/* ------------------------------------------------------
   CANVAS + GLOBALS
------------------------------------------------------ */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* ------------------------------------------------------
   ASSETS
------------------------------------------------------ */
const logo = new Image();
logo.src = "drillions-pixel-logo.png";

const sndBoost = new Audio("drillions_boost.wav");
const sndHit   = new Audio("drillions_hit.wav");
const sndExplode = new Audio("drillions_explode.wav");

sndBoost.volume = 0.5;

/* ------------------------------------------------------
   GAME STATES
------------------------------------------------------ */
let gameStarted = false;
let gameOver = false;
let startTime = 0;
let elapsed = 0;

/* ------------------------------------------------------
   PLAYER
------------------------------------------------------ */
const player = {
    x:200, y:200,
    w:260, h:130,
    vx:5, vy:4,
    drag:0.92,
    tapAccel:3,
    minSpeed:4,
    maxSpeed:14
};

/* ------------------------------------------------------
   STARFIELD
------------------------------------------------------ */
let stars = [];
const STAR_COUNT = 200;
function initStars() {
    stars = [];
    for (let i=0;i<STAR_COUNT;i++){
        stars.push({
            x:Math.random()*W,
            y:Math.random()*H,
            s:Math.random()*2+0.5,
            sp:Math.random()*0.7+0.2
        });
    }
}
initStars();

function updateStars(){
    for (let s of stars){
        s.y += s.sp;
        if (s.y>H){ s.y=-5; s.x=Math.random()*W; }
    }
}

function drawStars(){
    ctx.fillStyle="#8af3ff";
    ctx.globalAlpha=0.6;
    for (let s of stars){
        ctx.fillRect(s.x,s.y,s.s,s.s);
    }
    ctx.globalAlpha=1;
}

/* ------------------------------------------------------
   PLAYER PHYSICS
------------------------------------------------------ */
function updatePlayer(){
    if (!gameStarted || gameOver) return;

    player.vx *= player.drag;
    player.vy *= player.drag;

    let sp = Math.sqrt(player.vx**2 + player.vy**2);

    if (sp < player.minSpeed){
        let f = player.minSpeed/(sp||1);
        player.vx *= f; player.vy *= f;
    }
    if (sp > player.maxSpeed){
        let f = player.maxSpeed/sp;
        player.vx *= f; player.vy *= f;
    }

    player.x += player.vx;
    player.y += player.vy;

    if (player.x<=0 || player.x+player.w>=W) player.vx*=-1;
    if (player.y<=0 || player.y+player.h>=H) player.vy*=-1;

    player.x = Math.max(0, Math.min(W-player.w,player.x));
    player.y = Math.max(0, Math.min(H-player.h,player.y));
}

function drawPlayer(){
    ctx.drawImage(logo, player.x, player.y, player.w, player.h);
}

/* ------------------------------------------------------
   ASTEROIDS
------------------------------------------------------ */
const asteroids = [];
function spawnAsteroid(){
    if (!gameStarted || gameOver) return;

    asteroids.push({
        x:Math.random()*(W-50),
        y:-60,
        s:50,
        sp:3+Math.random()*2
    });
}
setInterval(spawnAsteroid, 800);

function updateAsteroids(){
    if (!gameStarted || gameOver) return;

    for (let a of asteroids){
        a.y += a.sp;
    }
}

function drawAsteroids(){
    ctx.fillStyle="#3a3a3a";
    for (let a of asteroids){
        ctx.fillRect(a.x,a.y,a.s,a.s);
        ctx.fillStyle="#777";
        ctx.fillRect(a.x+10,a.y+10,a.s-20,a.s-20);
        ctx.fillStyle="#3a3a3a";
    }
}

/* ------------------------------------------------------
   COLLISION
------------------------------------------------------ */
function checkCollision(){
    if (gameOver || !gameStarted) return;

    for (let a of asteroids){
        if (player.x < a.x+a.s &&
            player.x+player.w > a.x &&
            player.y < a.y+a.s &&
            player.y+player.h > a.y){

            sndExplode.play();
            endGame();
        }
    }
}

/* ------------------------------------------------------
   GAME OVER
------------------------------------------------------ */
function endGame(){
    gameOver = true;

    let survive = (elapsed/1000).toFixed(1);
    document.getElementById("finalTime").innerText =
        "YOU SURVIVED " + survive + "s";

    document.getElementById("gameOver").style.display = "flex";
}

function restart(){
    location.reload();
}

/* ------------------------------------------------------
   START GAME
------------------------------------------------------ */
function startGame(){
    document.getElementById("startScreen").style.display="none";
    gameStarted = true;
    startTime = performance.now();
}

/* ------------------------------------------------------
   TOUCH CONTROL
------------------------------------------------------ */
canvas.addEventListener("touchmove", e=>{
    if (!gameStarted || gameOver) return;

    const t = e.touches[0];
    const tx = t.clientX;
    const ty = t.clientY;

    const cx = player.x + player.w/2;
    const cy = player.y + player.h/2;

    let dx = tx - cx;
    let dy = ty - cy;
    let d  = Math.sqrt(dx*dx + dy*dy);
    if (d>0){ dx/=d; dy/=d; }

    player.vx += dx * player.tapAccel;
    player.vy += dy * player.tapAccel;

    sndBoost.play();
});

/* ------------------------------------------------------
   LOOP
------------------------------------------------------ */
function loop(){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);

    updateStars();
    drawStars();

    if (gameStarted && !gameOver){
        elapsed = performance.now() - startTime;
        document.getElementById("timer").innerText =
            "TIME: " + (elapsed/1000).toFixed(1) + "s";
    }

    updatePlayer();
    drawPlayer();

    updateAsteroids();
    drawAsteroids();

    checkCollision();

    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
