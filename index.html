<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRILLIONS — CHROME + ASTEROIDS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #gameCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: system-ui, sans-serif;
      color: #8af3ff;
      text-shadow: 0 0 6px #00eaff;
      font-size: 15px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="hud">DRILLIONS — CHROME MODE</div>
<canvas id="gameCanvas"></canvas>

<script>
// -------------------------------------------------------
// Canvas
// -------------------------------------------------------
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// -------------------------------------------------------
// Logo
// -------------------------------------------------------
const logo = new Image();
logo.src = "drillions-pixel-logo.png?v=" + Date.now();
let logoReady = false;
logo.onload = () => logoReady = true;

// -------------------------------------------------------
// Player
// -------------------------------------------------------
const player = {
  x: 150, y: 150,
  w: 300, h: 150,
  vx: 5, vy: 4,
  drag: 0.92,
  tapAccel: 3,
  minSpeed: 4,
  maxSpeed: 13
};

// -------------------------------------------------------
// Ghost trail
// -------------------------------------------------------
const ghostTrail = [];
const MAX_GHOSTS = 6;

// -------------------------------------------------------
// Sparks
// -------------------------------------------------------
const particles = [];
const MAX_PARTICLES = 120;

// -------------------------------------------------------
// Stars
// -------------------------------------------------------
const STAR_COUNT = 180;
let stars = [];

function initStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.6 + 0.2,
      tint: Math.random() < 0.5 ? "cool" : "warm"
    });
  }
}
initStars();

function updateStars() {
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) {
      s.y = -5;
      s.x = Math.random() * W;
    }
  }
}

function drawStars() {
  ctx.save();
  for (const s of stars) {
    ctx.fillStyle = s.tint === "cool" ? "#a7f3ff" : "#5ddcff";
    ctx.globalAlpha = 0.8;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.restore();
}

// -------------------------------------------------------
// Player update
// -------------------------------------------------------
function updatePlayer() {
  if (gameOver) return;

  player.vx *= player.drag;
  player.vy *= player.drag;

  let speed = Math.sqrt(player.vx ** 2 + player.vy ** 2);
  if (speed < player.minSpeed) {
    const f = player.minSpeed / (speed || 1);
    player.vx *= f;
    player.vy *= f;
  }
  if (speed > player.maxSpeed) {
    const f = player.maxSpeed / speed;
    player.vx *= f;
    player.vy *= f;
  }

  player.x += player.vx;
  player.y += player.vy;

  if (player.x <= 0 || player.x + player.w >= W) player.vx *= -1;
  if (player.y <= 0 || player.y + player.h >= H) player.vy *= -1;

  player.x = Math.max(0, Math.min(W - player.w, player.x));
  player.y = Math.max(0, Math.min(H - player.h, player.y));

  ghostTrail.unshift({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2
  });
  if (ghostTrail.length > MAX_GHOSTS) ghostTrail.pop();

  spawnTrailSparks();
}

// -------------------------------------------------------
// Ghost Trail Render
// -------------------------------------------------------
function drawGhostTrail() {
  ctx.save();
  ctx.imageSmoothingEnabled = false;

  for (let i = ghostTrail.length - 1; i >= 0; i--) {
    const g = ghostTrail[i];
    const t = (i + 1) / (ghostTrail.length + 1);
    const scale = 0.7 + t * 0.3;
    const alpha = 0.06 + t * 0.12;

    const w = player.w * scale;
    const h = player.h * scale;
    const x = g.x - w / 2;
    const y = g.y - h / 2;

    ctx.globalAlpha = alpha;
    ctx.drawImage(logo, x, y, w, h);
  }

  ctx.restore();
}

// -------------------------------------------------------
// Fix PNG fading: reset alpha and smoothing before drawing
// -------------------------------------------------------
function drawPlayer() {
  if (!logoReady) return;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(logo, player.x, player.y, player.w, player.h);
  ctx.restore();
}

// -------------------------------------------------------
// Sparks
// -------------------------------------------------------
function spawnTrailSparks() {
  const speed = Math.sqrt(player.vx ** 2 + player.vy ** 2);
  const intensity = Math.min(1, speed / player.maxSpeed);
  const count = 1 + Math.floor(intensity * 2);

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) break;

    const angle = Math.random() * Math.PI * 2;
    const spd = 0.5 + Math.random() * 1.2;

    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      alpha: 0.4 + Math.random() * 0.2,
      life: 40 + Math.random() * 20,
      size: 2 + Math.random() * 3,
      tint: Math.random() < 0.5 ? "cool" : "warm"
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha *= 0.96;
    p.life--;

    if (p.life <= 0 || p.alpha <= 0.05) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for (const p of particles) {
    ctx.fillStyle = p.tint === "cool"
      ? `rgba(180,230,255,${p.alpha})`
      : `rgba(230,230,240,${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// -------------------------------------------------------
// Asteroids
// -------------------------------------------------------
const asteroids = [];
const ASTEROID_SIZE = 55;
let gameOver = false;
let explosionParticles = [];

setInterval(() => {
  if (gameOver) return;
  asteroids.push({
    x: Math.random() * (W - ASTEROID_SIZE),
    y: -80,
    size: ASTEROID_SIZE,
    speed: 3 + Math.random() * 2
  });
}, 900);

// Pixel asteroid art
function drawAsteroids() {
  ctx.save();
  ctx.imageSmoothingEnabled = false;

  for (let a of asteroids) {
    const s = a.size;

    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(a.x, a.y, s, s);

    ctx.fillStyle = "#555";
    ctx.fillRect(a.x + s * 0.15, a.y + s * 0.15, s * 0.6, s * 0.6);

    ctx.fillStyle = "#777";
    ctx.fillRect(a.x + s * 0.2, a.y + s * 0.6, s * 0.25, s * 0.25);

    ctx.fillStyle = "#666";
    ctx.fillRect(a.x + s * 0.55, a.y + s * 0.25, s * 0.2, s * 0.2);
  }

  ctx.restore();
}

// Movement
function updateAsteroids() {
  for (let a of asteroids) a.y += a.speed;
}

// -------------------------------------------------------
// Instant-feel Collision
// -------------------------------------------------------
function checkAsteroidCollisions() {
  if (gameOver) return;

  const px = player.x;
  const py = player.y;
  const pw = player.w;
  const ph = player.h;

  for (let a of asteroids) {

    const hitPadding = 20;

    if (
      px < a.x + a.size - hitPadding &&
      px + pw > a.x + hitPadding &&
      py < a.y + a.size - hitPadding &&
      py + ph > a.y + hitPadding
    ) {
      triggerExplosion(px + pw / 2, py + ph / 2);
      gameOver = true;
      return;
    }
  }
}

// -------------------------------------------------------
// Explosion
// -------------------------------------------------------
function triggerExplosion(cx, cy) {
  for (let i = 0; i < 60; i++) {
    explosionParticles.push({
      x: cx,
      y: cy,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      alpha: 1,
      size: 4 + Math.random() * 4,
      color: Math.random() < 0.5 ? "#a7f3ff" : "#5ddcff"
    });
  }
}

function updateExplosion() {
  for (let i = explosionParticles.length - 1; i >= 0; i--) {
    let p = explosionParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha *= 0.94;
    if (p.alpha < 0.03) explosionParticles.splice(i, 1);
  }
}

function drawExplosion() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let p of explosionParticles) {
    ctx.fillStyle = p.color.replace(")", `,${p.alpha})`).replace("rgb", "rgba");
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.restore();
}

// -------------------------------------------------------
// Game Over Screen
// -------------------------------------------------------
function drawGameOver() {
  if (!gameOver) return;

  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#8af3ff";
  ctx.textAlign = "center";
  ctx.font = "48px Arial";
  ctx.fillText("DRILLIONS DESTROYED", W / 2, H / 2 - 20);

  ctx.font = "28px Arial";
  ctx.fillText("Tap to Restart", W / 2, H / 2 + 40);
  ctx.restore();
}

canvas.addEventListener("touchstart", () => {
  if (!gameOver) return;
  location.reload();
});

// -------------------------------------------------------
// Loop
// -------------------------------------------------------
function loop() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  updateStars();
  drawStars();

  updatePlayer();
  updateParticles();

  drawGhostTrail();
  drawParticles();
  drawPlayer();

  updateAsteroids();
  checkAsteroidCollisions();
  drawAsteroids();

  updateExplosion();
  drawExplosion();
  drawGameOver();

  requestAnimationFrame(loop);
}
loop();

// -------------------------------------------------------
// Touch Control
// -------------------------------------------------------
canvas.addEventListener("touchstart", accelerate);
canvas.addEventListener("touchmove", accelerate);

function accelerate(e) {
  if (gameOver) return;
  e.preventDefault();

  const t = e.touches[0];
  const tx = t.clientX;
  const ty = t.clientY;

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  let dx = tx - cx;
  let dy = ty - cy;
  const d = Math.sqrt(dx * dx + dy * dy);

  if (d > 0) {
    dx /= d;
    dy /= d;
  }

  player.vx += dx * player.tapAccel;
  player.vy += dy * player.tapAccel;
}
</script>

</body>
</html>
