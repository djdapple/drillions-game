<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRILLIONS – CHROME EDITION</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #gameCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: system-ui, sans-serif;
      color: #8af3ff;
      text-shadow: 0 0 6px #00eaff;
      font-size: 15px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="hud">DRILLIONS – CHROME MODE</div>

<canvas id="gameCanvas"></canvas>

<script>
// --------------------------------------
// Canvas Setup
// --------------------------------------
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// --------------------------------------
// Force-loaded Player Logo (fixes Safari)
// --------------------------------------
const logo = new Image();
logo.src = "drillions-pixel-logo.png?v=" + Date.now(); // prevent caching
let logoReady = false;
logo.onload = () => logoReady = true;

// --------------------------------------
// Player Object
// --------------------------------------
const player = {
  x: 150, y: 150,
  w: 300, h: 150,
  vx: 5, vy: 4,
  drag: 0.92,
  tapAccel: 3,
  minSpeed: 4,
  maxSpeed: 13
};

// --------------------------------------
// Ghost Trail
// --------------------------------------
const ghostTrail = [];
const MAX_GHOSTS = 6;

// --------------------------------------
// Chrome Spark Particles
// --------------------------------------
const particles = [];
const MAX_PARTICLES = 120;

// --------------------------------------
// Chrome Starfield Background
// --------------------------------------
const STAR_COUNT = 180;
let stars = [];

function initStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.6 + 0.2,
      tint: Math.random() < 0.5 ? "cool" : "warm"
    });
  }
}
initStars();

function updateStars() {
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) {
      s.y = -5;
      s.x = Math.random() * W;
    }
  }
}

function drawStars() {
  for (const s of stars) {
    ctx.fillStyle = s.tint === "cool" ? "#a7f3ff" : "#5ddcff";
    ctx.globalAlpha = 0.8;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1.0;
}

// --------------------------------------
// Player Physics + Movement
// --------------------------------------
function updatePlayer() {
  player.vx *= player.drag;
  player.vy *= player.drag;

  let speed = Math.sqrt(player.vx**2 + player.vy**2);

  if (speed < player.minSpeed) {
    const f = player.minSpeed / (speed || 1);
    player.vx *= f;
    player.vy *= f;
  }

  if (speed > player.maxSpeed) {
    const f = player.maxSpeed / speed;
    player.vx *= f;
    player.vy *= f;
  }

  player.x += player.vx;
  player.y += player.vy;

  if (player.x <= 0 || player.x + player.w >= W) player.vx *= -1;
  if (player.y <= 0 || player.y + player.h >= H) player.vy *= -1;

  // clamp
  player.x = Math.max(0, Math.min(W - player.w, player.x));
  player.y = Math.max(0, Math.min(H - player.h, player.y));

  // ghost trail
  ghostTrail.unshift({ 
    x: player.x + player.w/2,
    y: player.y + player.h/2
  });
  if (ghostTrail.length > MAX_GHOSTS) ghostTrail.pop();

  // chrome sparks
  spawnTrailSparks();
}

// --------------------------------------
// Ghost Trail Drawing
// --------------------------------------
function drawGhostTrail() {
  for (let i = ghostTrail.length - 1; i >= 0; i--) {
    const g = ghostTrail[i];
    const t = (i + 1) / (ghostTrail.length + 1);
    const scale = 0.7 + t * 0.3;
    const alpha = 0.06 + t * 0.12;

    const w = player.w * scale;
    const h = player.h * scale;
    const x = g.x - w/2;
    const y = g.y - h/2;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(logo, x, y, w, h);
    ctx.restore();
  }
}

// --------------------------------------
// Chrome Sparks
// --------------------------------------
function spawnTrailSparks() {
  const speed = Math.sqrt(player.vx**2 + player.vy**2);
  const intensity = Math.min(1, speed / player.maxSpeed);
  const count = 1 + Math.floor(intensity * 2);

  const cx = player.x + player.w/2;
  const cy = player.y + player.h/2;

  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) break;

    const angle = Math.random() * Math.PI * 2;
    const spd = 0.5 + Math.random() * 1.2;

    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle)*spd,
      vy: Math.sin(angle)*spd,
      alpha: 0.4 + Math.random()*0.2,
      life: 40 + Math.random()*20,
      size: 2 + Math.random()*3,
      tint: Math.random() < 0.5 ? "cool" : "warm"
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha *= 0.96;
    p.life--;

    if (p.life <= 0 || p.alpha <= 0.05) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  particles.forEach(p => {
    ctx.fillStyle = p.tint === "cool" ?
      `rgba(180,230,255,${p.alpha})` :
      `rgba(230,230,240,${p.alpha})`;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  });

  ctx.restore();
}

// --------------------------------------
// Draw Main Player
// --------------------------------------
function drawPlayer() {
  if (logoReady) {
    ctx.drawImage(logo, player.x, player.y, player.w, player.h);
  }
}

// --------------------------------------
// Game Loop
// --------------------------------------
function loop() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  updateStars();
  drawStars();

  updatePlayer();
  updateParticles();

  drawGhostTrail();
  drawParticles();
  drawPlayer();

  requestAnimationFrame(loop);
}
loop();

// --------------------------------------
// Touch Controls
// --------------------------------------
canvas.addEventListener("touchstart", accelerate);
canvas.addEventListener("touchmove", accelerate);

function accelerate(e) {
  e.preventDefault();
  const t = e.touches[0];
  
  const tx = t.clientX;
  const ty = t.clientY;

  const cx = player.x + player.w/2;
  const cy = player.y + player.h/2;

  let dx = tx - cx;
  let dy = ty - cy;
  const d = Math.sqrt(dx*dx + dy*dy);

  if (d > 0) {
    dx /= d;
    dy /= d;
  }

  player.vx += dx * player.tapAccel;
  player.vy += dy * player.tapAccel;
}
</script>

</body>
</html>
