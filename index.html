<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRILLIONS – STARFIELD MODE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #gameCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: system-ui, sans-serif;
      color: #8af3ff;
      text-shadow: 0 0 6px #00eaff;
      font-size: 15px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="hud">
  <div>CHROME STARFIELD MODE</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// Setup
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Load logo
const logo = new Image();
logo.src = "drillions-pixel-logo.png";
let logoReady = false;
logo.onload = () => logoReady = true;

// Player
const player = {
  x: 150,
  y: 150,
  w: 300,
  h: 150,
  vx: 5,
  vy: 4,
  drag: 0.92,
  tapAccel: 3,
  minSpeed: 4,
  maxSpeed: 13
};

// Starfield
const starCount = 180;
const stars = [];

function spawnStars() {
  stars.length = 0;
  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.6 + 0.3,
      chrome: Math.random()
    });
  }
}
spawnStars();

// Update stars (parallax)
function updateStars() {
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > H) {
      s.y = -5;
      s.x = Math.random() * W;
    }
  });
}

// Draw stars
function drawStars() {
  stars.forEach(s => {
    let chromeShade = s.chrome > 0.5 ? "#a7f3ff" : "#5ddcff";
    ctx.fillStyle = chromeShade;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
}

// Player physics
function updatePlayer() {
  player.vx *= player.drag;
  player.vy *= player.drag;

  let speed = Math.sqrt(player.vx ** 2 + player.vy ** 2);

  if (speed < player.minSpeed) {
    const f = player.minSpeed / (speed || 1);
    player.vx *= f;
    player.vy *= f;
  }
  
  if (speed > player.maxSpeed) {
    const f = player.maxSpeed / speed;
    player.vx *= f;
    player.vy *= f;
  }

  player.x += player.vx;
  player.y += player.vy;

  if (player.x <= 0 || player.x + player.w >= W) player.vx *= -1;
  if (player.y <= 0 || player.y + player.h >= H) player.vy *= -1;

  player.x = Math.max(0, Math.min(W - player.w, player.x));
  player.y = Math.max(0, Math.min(H - player.h, player.y));
}

// Draw player
function drawPlayer() {
  if (logoReady) {
    ctx.drawImage(logo, player.x, player.y, player.w, player.h);
  }
}

// Loop
function loop() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  updateStars();
  drawStars();

  updatePlayer();
  drawPlayer();

  requestAnimationFrame(loop);
}
loop();

// Tap acceleration
canvas.addEventListener("touchstart", boost);
canvas.addEventListener("touchmove", boost);

function boost(e) {
  e.preventDefault();
  let t = e.touches[0];
  let cx = player.x + player.w / 2;
  let cy = player.y + player.h / 2;

  let dx = t.clientX - cx;
  let dy = t.clientY - cy;
  let d = Math.sqrt(dx*dx + dy*dy);

  if (d > 0) {
    dx /= d;
    dy /= d;
  }

  player.vx += dx * player.tapAccel;
  player.vy += dy * player.tapAccel;
}
</script>

</body>
</html>
