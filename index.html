<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRILLIONS – SPEED ZONE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
      touch-action: none;
    }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: system-ui, sans-serif;
      color: #ffc978;
      text-shadow: 0 0 6px #ffae3f;
      font-size: 15px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="hud">
  <div>MODE: <strong>DRILLIONS SPEED ZONE</strong></div>
  <div>SCORE: <span id="scoreValue">0</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let score = 0;
const scoreEl = document.getElementById("scoreValue");

// load main logo
const logoImg = new Image();
logoImg.src = "drillions-pixel-logo.png";
let logoLoaded = false;
logoImg.onload = () => logoLoaded = true;

// LOAD BACKGROUND DRILLIONS LOGO
const bgLogo = new Image();
bgLogo.src = "drillions-bg.png"; // <-- upload this file to repo
let bgLoaded = false;
bgLogo.onload = () => bgLoaded = true;

// PLAYER SPEED UPGRADE
const player = {
  x: 200,
  y: 200,
  w: 300,
  h: 150,
  vx: 6,     // faster
  vy: 4.5,
  minSpeed: 4.5,  // faster cruise
  maxSpeed: 13.5, // faster top speed
  drag: 0.90,     // less slowdown
  tapAccel: 3.2   // stronger acceleration
};

// GHOST TRAIL
const ghostTrail = [];
const MAX_GHOSTS = 6;

// ------------------------
// UPDATE PLAYER SPEED + MOVEMENT
// ------------------------
function updatePlayer() {
  player.vx *= player.drag;
  player.vy *= player.drag;

  const speed = Math.sqrt(player.vx*player.vx + player.vy*player.vy);

  if (speed < player.minSpeed) {
    if (speed > 0.01) {
      const f = player.minSpeed / speed;
      player.vx *= f;
      player.vy *= f;
    } else {
      player.vx = player.minSpeed;
      player.vy = 0;
    }
  }

  if (speed > player.maxSpeed) {
    const f = player.maxSpeed / speed;
    player.vx *= f;
    player.vy *= f;
  }

  player.x += player.vx;
  player.y += player.vy;

  ghostTrail.unshift({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2
  });
  if (ghostTrail.length > MAX_GHOSTS) ghostTrail.pop();

  let hitX = false, hitY = false;

  if (player.x <= 0) { player.x = 0; player.vx *= -1; hitX=true; }
  if (player.x + player.w >= W) { player.x = W-player.w; player.vx *= -1; hitX=true; }
  if (player.y <= 0) { player.y = 0; player.vy *= -1; hitY=true; }
  if (player.y + player.h >= H) { player.y = H-player.h; player.vy *= -1; hitY=true; }

  if (hitX || hitY) score += 10;

  const COR = 50;
  if (hitX && hitY) {
    const corner =
      (player.x < COR && player.y < COR) ||
      (player.x + player.w > W-COR && player.y < COR) ||
      (player.x < COR && player.y + player.h > COR) ||
      (player.x + player.w > W-COR && player.y + player.h > H-COR);
    if (corner) score += 100;
  }

  scoreEl.textContent = score;
}

// ------------------------
// DRAW LARGE BACKGROUND DRILLIONS LOGO
// ------------------------
function drawBackgroundDrillions() {
  if (!bgLoaded) return;

  const size = Math.min(W, H) * 1.3;
  const x = (W - size) / 2;
  const y = (H - size) / 2;

  ctx.save();
  ctx.globalAlpha = 0.08; // faint, stylish
  ctx.drawImage(bgLogo, x, y, size, size);
  ctx.restore();
}

// ------------------------
// DRAW GHOST TRAIL
// ------------------------
function drawGhostTrail() {
  if (!logoLoaded) return;

  for (let i = ghostTrail.length - 1; i >= 0; i--) {
    const g = ghostTrail[i];
    const t = (i+1) / (ghostTrail.length+1);

    const scale = 0.7 + t * 0.25;
    const alpha = 0.06 + t * 0.15;

    const w = player.w * scale;
    const h = player.h * scale;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(logoImg, g.x - w/2, g.y - h/2, w, h);
    ctx.restore();
  }
}

// ------------------------
// DRAW MAIN LOGO
// ------------------------
function drawPlayer() {
  if (!logoLoaded) return;
  ctx.drawImage(logoImg, player.x, player.y, player.w, player.h);
}

// ------------------------
// MAIN DRAW
// ------------------------
function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,W,H);

  drawBackgroundDrillions();
  drawGhostTrail();
  drawPlayer();
}

// ------------------------
// GAME LOOP
// ------------------------
function loop() {
  if (logoLoaded) {
    updatePlayer();
    draw();
  }
  requestAnimationFrame(loop);
}
loop();

// ------------------------
// TAP ACCEL MODE
// ------------------------
canvas.addEventListener("touchstart", handleTap);
canvas.addEventListener("touchmove", handleTap);

function handleTap(e) {
  e.preventDefault();

  const t = e.touches[0];
  const tx = t.clientX;
  const ty = t.clientY;

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  let dx = tx - cx;
  let dy = ty - cy;

  const d = Math.sqrt(dx*dx + dy*dy);
  if (d > 0) {
    dx /= d;
    dy /= d;
  }

  // more aggressive acceleration
  player.vx += dx * player.tapAccel;
  player.vy += dy * player.tapAccel;
}
</script>

</body>
</html>
