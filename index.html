<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRILLIONS – Clean Stars + Chrome Trails</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #gameCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
  </style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<script>
// ------------------------------
// Canvas
// ------------------------------
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize(){
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

// ------------------------------
// Load Logo
// ------------------------------
const logo = new Image();
logo.src = "drillions-pixel-logo.png?v=" + Date.now();
let logoReady = false;
logo.onload = () => logoReady = true;

// ------------------------------
// Player (smooth, fast, clean)
// ------------------------------
const p = {
  x: 150,
  y: 150,
  w: 260,
  h: 130,
  vx: 4,
  vy: 4,
  drag: 0.94,
  accel: 2,
  minSpeed: 3.0,
  maxSpeed: 10
};

// ------------------------------
// Starfield (your old one)
// ------------------------------
const STAR_COUNT = 140;
let stars = [];

function initStars(){
  stars = [];
  for(let i=0;i<STAR_COUNT;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      size: Math.random()*1.8 + 0.4,
      speed: Math.random()*0.4 + 0.2,
      tint: Math.random() < 0.5 ? "cool" : "warm"
    });
  }
}
initStars();

function updateStars(){
  for(let s of stars){
    s.y += s.speed;
    if(s.y > H){
      s.y = -2;
      s.x = Math.random()*W;
    }
  }
}

function drawStars(){
  ctx.globalAlpha = 0.8;
  for(let s of stars){
    ctx.fillStyle = s.tint === "cool" ? "#aaf5ff" : "#66d9ff";
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;
}

// ------------------------------
// Chrome Trail (your original)
// ------------------------------
const trail = [];
const MAX_TRAIL = 40;

function updatePlayer(){
  p.vx *= p.drag;
  p.vy *= p.drag;

  const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
  if(speed < p.minSpeed){
    const f = p.minSpeed / (speed || 1);
    p.vx *= f;
    p.vy *= f;
  }
  if(speed > p.maxSpeed){
    const f = p.maxSpeed / speed;
    p.vx *= f;
    p.vy *= f;
  }

  p.x += p.vx;
  p.y += p.vy;

  if(p.x <= 0 || p.x + p.w >= W) p.vx *= -1;
  if(p.y <= 0 || p.y + p.h >= H) p.vy *= -1;

  p.x = Math.min(Math.max(p.x,0), W - p.w);
  p.y = Math.min(Math.max(p.y,0), H - p.h);

  const cx = p.x + p.w/2;
  const cy = p.y + p.h/2;

  trail.unshift({ x: cx, y: cy });
  if(trail.length > MAX_TRAIL) trail.pop();
}

function drawTrail(){
  if(trail.length < 2) return;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for(let i=0; i<trail.length-1; i++){
    const a = trail[i];
    const b = trail[i+1];
    const t = 1 - i / trail.length;

    ctx.lineWidth = 7 * t;
    ctx.strokeStyle = `rgba(150,220,255,${0.12 + t*0.2})`;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  ctx.restore();
}

// ------------------------------
// Draw Player
// ------------------------------
function drawPlayer(){
  if(!logoReady) return;
  ctx.drawImage(logo, p.x, p.y, p.w, p.h);
}

// ------------------------------
// Main Loop
// ------------------------------
function loop(){
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,W,H);

  updateStars();
  updatePlayer();

  drawStars();
  drawTrail();
  drawPlayer();

  requestAnimationFrame(loop);
}
loop();

// ------------------------------
// Touch Acceleration
// ------------------------------
canvas.addEventListener("touchstart", accel);
canvas.addEventListener("touchmove", accel);

function accel(e){
  e.preventDefault();
  const t = e.touches[0];
  const tx = t.clientX;
  const ty = t.clientY;

  const cx = p.x + p.w/2;
  const cy = p.y + p.h/2;

  let dx = tx - cx;
  let dy = ty - cy;

  const d = Math.sqrt(dx*dx + dy*dy);
  if(d > 0){
    dx/=d;
    dy/=d;
  }

  p.vx += dx * p.accel;
  p.vy += dy * p.accel;
}
</script>

</body>
</html>
