<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRILLIONS STARFIELD</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  canvas {
    width: 100vw;
    height: 100vh;
    display: block;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<script>
// --------------------------------------------------
// Set up canvas
// --------------------------------------------------
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// --------------------------------------------------
// Create stars
// --------------------------------------------------
const STAR_COUNT = 250;
let stars = [];

function initStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2.2 + 0.3,
            speed: Math.random() * 1.3 + 0.4,
            tint: Math.random() < 0.5 ? "cool" : "warm"
        });
    }
}
initStars();

// --------------------------------------------------
// Update + draw starfield
// --------------------------------------------------
function updateStars() {
    for (let s of stars) {
        s.y += s.speed;
        if (s.y > canvas.height) {
            s.y = -5;
            s.x = Math.random() * canvas.width;
        }
    }
}

function drawStars() {
    for (let s of stars) {
        ctx.fillStyle = s.tint === "cool" ? "#a7f3ff" : "#5ddcff";
        ctx.globalAlpha = 0.85;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1.0;
}

// --------------------------------------------------
// Loop (cinematic smooth)
// --------------------------------------------------
function loop() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    updateStars();
    drawStars();

    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
