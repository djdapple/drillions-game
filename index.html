<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRILLIONS – CHROME MODE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
  #hud {
    position: fixed;
    top: 14px;
    left: 14px;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    color: #8af3ff;
    text-shadow: 0 0 6px #00eaff;
    z-index: 20;
  }
</style>
</head>
<body>

<div id="hud">DRILLIONS – CHROME MODE</div>
<canvas id="game"></canvas>

<script>
// =========================================
// CANVAS SETUP
// =========================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =========================================
// PLAYER LOGO
// =========================================
const logo = new Image();
logo.src = "drillions-pixel-logo.png";  
let logoReady = false;
logo.onload = () => logoReady = true;

// =========================================
// PLAYER OBJECT (SUPER SMOOTH VERSION)
// =========================================
const player = {
  x: 200,
  y: 200,
  w: 240,
  h: 110,
  vx: 0,
  vy: 0,
  accel: 2200,
  maxSpeed: 900,
  drag: 0.96
};

// =========================================
// STARFIELD
// =========================================
const STAR_COUNT = 180;
let stars = [];

function initStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.6 + 0.2
    });
  }
}
initStars();

// =========================================
// UPDATE PLAYER (delta-time smooth)
// =========================================
function updatePlayer(dt) {
  // drag
  player.vx *= player.drag;
  player.vy *= player.drag;

  // speed clamp
  const speed = Math.hypot(player.vx, player.vy);
  if (speed > player.maxSpeed) {
    const s = player.maxSpeed / speed;
    player.vx *= s;
    player.vy *= s;
  }

  // movement
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // border bounce
  if (player.x < 0) { player.x = 0; player.vx *= -0.7; }
  if (player.y < 0) { player.y = 0; player.vy *= -0.7; }

  if (player.x + player.w > canvas.width) {
    player.x = canvas.width - player.w;
    player.vx *= -0.7;
  }
  if (player.y + player.h > canvas.height) {
    player.y = canvas.height - player.h;
    player.vy *= -0.7;
  }

  // draw
  if (logoReady) {
    ctx.drawImage(logo, player.x, player.y, player.w, player.h);
  }
}

// =========================================
// TOUCH MOVEMENT
// =========================================
function accelerate(e) {
  e.preventDefault();

  const t = e.touches[0];
  const tx = t.clientX;
  const ty = t.clientY;

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  let dx = tx - cx;
  let dy = ty - cy;

  const d = Math.hypot(dx, dy);
  if (d > 0) {
    dx /= d;
    dy /= d;
  }

  // Add speed
  player.vx += dx * player.accel * 0.016;
  player.vy += dy * player.accel * 0.016;
}

canvas.addEventListener("touchstart", accelerate);
canvas.addEventListener("touchmove", accelerate);

// =========================================
// MAIN LOOP WITH DELTA-TIME
// =========================================
let last = 0;

function loop(t) {
  requestAnimationFrame(loop);

  let dt = (t - last) / 1000;
  if (dt > 0.05) dt = 0.05;
  last = t;

  // Clear
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  for (let s of stars) {
    s.y += s.speed;
    if (s.y > canvas.height) {
      s.y = -3;
      s.x = Math.random() * canvas.width;
    }
    ctx.fillStyle = "#8af3ff";
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  // Player
  updatePlayer(dt);
}

loop();
</script>

</body>
</html>
