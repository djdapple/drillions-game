<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRILLIONS – SAFE MODE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #gameCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: system-ui, sans-serif;
      color: #ffd88a;
      text-shadow: 0 0 4px #ffae3f;
      font-size: 15px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="hud">
  <div>SAFE MODE: RUNNING</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// Core setup
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Load player logo
const logo = new Image();
logo.src = "drillions-pixel-logo.png";
let logoReady = false;
logo.onload = () => logoReady = true;

// Player
const player = {
  x: 150,
  y: 150,
  w: 300,
  h: 150,
  vx: 5,
  vy: 4,
  drag: 0.92,
  tapAccel: 3,
  minSpeed: 4,
  maxSpeed: 13
};

// Movement + physics
function updatePlayer() {
  // drag
  player.vx *= player.drag;
  player.vy *= player.drag;

  let speed = Math.sqrt(player.vx ** 2 + player.vy ** 2);

  // enforce minimum speed
  if (speed < player.minSpeed) {
    if (speed > 0.1) {
      const f = player.minSpeed / speed;
      player.vx *= f;
      player.vy *= f;
    }
  }

  // enforce max speed
  if (speed > player.maxSpeed) {
    const f = player.maxSpeed / speed;
    player.vx *= f;
    player.vy *= f;
  }

  // apply movement
  player.x += player.vx;
  player.y += player.vy;

  // bounce
  if (player.x <= 0 || player.x + player.w >= W) {
    player.vx *= -1;
  }
  if (player.y <= 0 || player.y + player.h >= H) {
    player.vy *= -1;
  }

  // clamp to screen
  if (player.x < 0) player.x = 0;
  if (player.y < 0) player.y = 0;
  if (player.x + player.w > W) player.x = W - player.w;
  if (player.y + player.h > H) player.y = H - player.h;
}

// Draw everything
function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  if (logoReady) {
    ctx.drawImage(logo, player.x, player.y, player.w, player.h);
  }
}

// Loop
function loop() {
  updatePlayer();
  draw();
  requestAnimationFrame(loop);
}
loop();

// Tap to accelerate
canvas.addEventListener("touchstart", handleTap);
canvas.addEventListener("touchmove", handleTap);

function handleTap(e) {
  e.preventDefault();
  const t = e.touches[0];

  const tx = t.clientX;
  const ty = t.clientY;

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  let dx = tx - cx;
  let dy = ty - cy;

  const d = Math.sqrt(dx * dx + dy * dy);
  if (d > 0) {
    dx /= d;
    dy /= d;
  }

  player.vx += dx * player.tapAccel;
  player.vy += dy * player.tapAccel;
}
</script>

</body>
</html>
