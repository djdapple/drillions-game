<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRILLIONS – GHOST TRAIL EDITION</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
      touch-action: none;
    }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: system-ui, sans-serif;
      color: #ffc978;
      text-shadow: 0 0 6px #ffae3f;
      font-size: 15px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="hud">
  <div>MODE: <strong>DRILLIONS GHOST TRAIL</strong></div>
  <div>SCORE: <span id="scoreValue">0</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let score = 0;
const scoreEl = document.getElementById("scoreValue");

// Load Drillions logo
const logoImg = new Image();
logoImg.src = "drillions-pixel-logo.png"; // keep same file name in repo
let logoLoaded = false;
logoImg.onload = () => logoLoaded = true;

// Player car-like movement
const player = {
  x: 200,
  y: 200,
  w: 300,
  h: 150,
  vx: 4,
  vy: 3,
  minSpeed: 3.5,
  maxSpeed: 10.5,
  drag: 0.92,
  tapAccel: 2.5
};

// Ghost trail (6 clones)
const ghostTrail = [];
const MAX_GHOSTS = 6;

// ------------------------
// UPDATE PLAYER MOVEMENT
// ------------------------
function updatePlayer() {
  // Car slow down
  player.vx *= player.drag;
  player.vy *= player.drag;

  // Maintain minimum cruising speed
  const speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);

  if (speed < player.minSpeed) {
    if (speed > 0.01) {
      const f = player.minSpeed / speed;
      player.vx *= f;
      player.vy *= f;
    } else {
      player.vx = player.minSpeed;
      player.vy = 0;
    }
  }

  // Cap max speed
  if (speed > player.maxSpeed) {
    const f = player.maxSpeed / speed;
    player.vx *= f;
    player.vy *= f;
  }

  // Movement
  player.x += player.vx;
  player.y += player.vy;

  // Save to ghost trail
  ghostTrail.unshift({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2
  });
  if (ghostTrail.length > MAX_GHOSTS) ghostTrail.pop();

  // Bounce collisions
  let hitX = false, hitY = false;

  if (player.x <= 0) { player.x = 0; player.vx *= -1; hitX=true; }
  if (player.x + player.w >= W) { player.x = W-player.w; player.vx *= -1; hitX=true; }
  if (player.y <= 0) { player.y = 0; player.vy *= -1; hitY=true; }
  if (player.y + player.h >= H) { player.y = H-player.h; player.vy *= -1; hitY=true; }

  if (hitX || hitY) score += 10;

  // Corner bonus
  const CORNER = 50;
  if (hitX && hitY) {
    const corner =
      (player.x < CORNER && player.y < CORNER) ||
      (player.x + player.w > W - CORNER && player.y < CORNER) ||
      (player.x < CORNER && player.y + player.h > H - CORNER) ||
      (player.x + player.w > W - CORNER && player.y + player.h > H - CORNER);

    if (corner) score += 100;
  }

  scoreEl.textContent = score;
}

// ------------------------
// DRAW GHOST TRAIL
// ------------------------
function drawGhostTrail() {
  if (!logoLoaded) return;

  for (let i = ghostTrail.length - 1; i >= 0; i--) {
    const g = ghostTrail[i];
    const t = (i + 1) / (ghostTrail.length + 1); 

    const scale = 0.7 + t * 0.23; 
    const alpha = 0.06 + t * 0.15; 

    const w = player.w * scale;
    const h = player.h * scale;
    const x = g.x - w / 2;
    const y = g.y - h / 2;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(logoImg, x, y, w, h);
    ctx.restore();
  }
}

// ------------------------
// CRT EFFECT
// ------------------------
function drawCRT() {
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  for (let y = 0; y < H; y += 2) {
    ctx.fillRect(0, y, W, 1);
  }
  ctx.restore();

  ctx.save();
  const v = ctx.createRadialGradient(
    W/2, H/2, Math.min(W,H)*0.4,
    W/2, H/2, Math.max(W,H)*0.75
  );
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(0,0,0,0.75)");
  ctx.fillStyle = v;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

// ------------------------
// DRAW
// ------------------------
function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.fillRect(0,0,W,H);

  drawGhostTrail();

  if (logoLoaded) {
    ctx.drawImage(logoImg, player.x, player.y, player.w, player.h);
  }

  drawCRT();
}

// ------------------------
// LOOP
// ------------------------
function loop() {
  if (logoLoaded) {
    updatePlayer();
    draw();
  }
  requestAnimationFrame(loop);
}
loop();

// ------------------------
// TAP-TO-ACCELERATE
// ------------------------
canvas.addEventListener("touchstart", handleTap);
canvas.addEventListener("touchmove", handleTap);

function handleTap(e) {
  e.preventDefault();
  const t = e.touches[0];

  const tx = t.clientX;
  const ty = t.clientY;

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  let dx = tx - cx;
  let dy = ty - cy;

  const d = Math.sqrt(dx*dx + dy*dy);
  if (d > 0) {
    dx /= d;
    dy /= d;
  }

  // acceleration (like pressing gas)
  player.vx += dx * player.tapAccel;
  player.vy += dy * player.tapAccel;
}
</script>

</body>
</html>
