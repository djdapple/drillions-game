<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DRILLIONS – CHROME ASTEROIDS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: system-ui, sans-serif;
      color: #8af3ff;
      text-shadow: 0 0 6px #00eaff;
      font-size: 15px;
      z-index: 10;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

<div class="hud">DRILLIONS – CHROME MODE</div>
<canvas id="gameCanvas"></canvas>

<script>
// ----------------------------------------------------
// Canvas Setup
// ----------------------------------------------------
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ----------------------------------------------------
// Assets: Logo
// ----------------------------------------------------
const logo = new Image();
logo.src = "drillions-pixel-logo.png?v=" + Date.now();
let logoReady = false;
logo.onload = () => { logoReady = true; };

// ----------------------------------------------------
// Assets: Sounds
// ----------------------------------------------------
let boostSfx   = new Audio("drillions_boost.wav");
let hitSfx     = new Audio("drillions_hit.wav");
let explodeSfx = new Audio("drillions_explode.wav");

let audioUnlocked = false;

// unlock audio on first touch gesture
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;

  [boostSfx, hitSfx, explodeSfx].forEach(sfx => {
    try {
      sfx.muted = true;
      let p = sfx.play();
      if (p && p.then) {
        p.then(() => {
          sfx.pause();
          sfx.currentTime = 0;
          sfx.muted = false;
        }).catch(() => {
          sfx.muted = false;
        });
      } else {
        sfx.muted = false;
      }
    } catch(e) {
      sfx.muted = false;
    }
  });
}

// helper to safely play sounds without throwing
function playSfx(sfx) {
  if (!audioUnlocked) return;
  try {
    sfx.currentTime = 0;
    sfx.play().catch(() => {});
  } catch (e) {}
}

// ----------------------------------------------------
// Player
// ----------------------------------------------------
const player = {
  x: 150,
  y: 150,
  w: 260,   // slightly smaller than before for better feel
  h: 130,
  vx: 5,
  vy: 4,
  drag: 0.92,
  tapAccel: 3.0,
  minSpeed: 4,
  maxSpeed: 13
};

// ----------------------------------------------------
// Ghost Trail & Chrome Sparks
// ----------------------------------------------------
const ghostTrail = [];
const MAX_GHOSTS = 6;

const particles = [];
const MAX_PARTICLES = 120;

// ----------------------------------------------------
// Starfield
// ----------------------------------------------------
const STAR_COUNT = 180;
let stars = [];

function initStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.6 + 0.2,
      tint: Math.random() < 0.5 ? "cool" : "warm"
    });
  }
}
initStars();

function updateStars() {
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) {
      s.y = -5;
      s.x = Math.random() * W;
    }
  }
}

function drawStars() {
  for (const s of stars) {
    ctx.fillStyle = s.tint === "cool" ? "#a7f3ff" : "#5ddcff";
    ctx.globalAlpha = 0.8;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1.0;
}

// ----------------------------------------------------
// Player Physics
// ----------------------------------------------------
let gameOver = false;

function updatePlayer() {
  if (gameOver) return;

  player.vx *= player.drag;
  player.vy *= player.drag;

  let speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);

  if (speed < player.minSpeed) {
    const f = player.minSpeed / (speed || 1);
    player.vx *= f;
    player.vy *= f;
  }

  if (speed > player.maxSpeed) {
    const f = player.maxSpeed / speed;
    player.vx *= f;
    player.vy *= f;
  }

  player.x += player.vx;
  player.y += player.vy;

  // bounce off edges
  if (player.x <= 0 || player.x + player.w >= W) {
    player.vx *= -1;
  }
  if (player.y <= 0 || player.y + player.h >= H) {
    player.vy *= -1;
  }

  // clamp
  player.x = Math.max(0, Math.min(W - player.w, player.x));
  player.y = Math.max(0, Math.min(H - player.h, player.y));

  // ghost trail
  ghostTrail.unshift({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2
  });
  if (ghostTrail.length > MAX_GHOSTS) ghostTrail.pop();

  spawnTrailSparks();
}

function drawGhostTrail() {
  for (let i = ghostTrail.length - 1; i >= 0; i--) {
    const g = ghostTrail[i];
    const t = (i + 1) / (ghostTrail.length + 1);
    const scale = 0.7 + t * 0.3;
    const alpha = 0.06 + t * 0.12;

    const w = player.w * scale;
    const h = player.h * scale;
    const x = g.x - w / 2;
    const y = g.y - h / 2;

    if (!logoReady) continue;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(logo, x, y, w, h);
    ctx.restore();
  }
}

// Chrome sparks
function spawnTrailSparks() {
  const speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  const intensity = Math.min(1, speed / player.maxSpeed);
  const count = 1 + Math.floor(intensity * 2);

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) break;

    const angle = Math.random() * Math.PI * 2;
    const spd = 0.5 + Math.random() * 1.2;

    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      alpha: 0.4 + Math.random() * 0.2,
      life: 40 + Math.random() * 20,
      size: 2 + Math.random() * 3,
      tint: Math.random() < 0.5 ? "cool" : "warm"
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha *= 0.96;
    p.life--;

    if (p.life <= 0 || p.alpha <= 0.05) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  particles.forEach(p => {
    ctx.fillStyle =
      p.tint === "cool"
        ? `rgba(180,230,255,${p.alpha})`
        : `rgba(230,230,240,${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

// ----------------------------------------------------
// Asteroids + Explosion
// ----------------------------------------------------
const asteroids = [];
const ASTEROID_SIZE = 46;
const ASTEROID_SPEED = 2.4;

let explosionParticles = [];

// spawn asteroids from top
setInterval(() => {
  if (gameOver) return;
  asteroids.push({
    x: Math.random() * (W - ASTEROID_SIZE),
    y: -80,
    size: ASTEROID_SIZE,
    speed: ASTEROID_SPEED + Math.random() * 2
  });
}, 1200);

function updateAsteroids() {
  if (gameOver) return;
  for (let a of asteroids) {
    a.y += a.speed;
  }
}

function drawAsteroids() {
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  for (let a of asteroids) {
    // dark outer square
    ctx.fillStyle = "#252525";
    ctx.fillRect(a.x, a.y, a.size, a.size);
    // lighter inner square
    ctx.fillStyle = "#7a7a7a";
    ctx.fillRect(a.x + 7, a.y + 7, a.size - 14, a.size - 14);
  }
  ctx.restore();
}

function checkAsteroidCollisions() {
  if (gameOver) return;

  const px = player.x;
  const py = player.y;
  const pw = player.w;
  const ph = player.h;

  for (let a of asteroids) {
    if (
      px < a.x + a.size &&
      px + pw > a.x &&
      py < a.y + a.size &&
      py + ph > a.y
    ) {
      // collision
      triggerExplosion(px + pw / 2, py + ph / 2);
      playSfx(hitSfx);
      playSfx(explodeSfx);
      gameOver = true;
      break;
    }
  }
}

function triggerExplosion(cx, cy) {
  explosionParticles = [];
  for (let i = 0; i < 80; i++) {
    explosionParticles.push({
      x: cx,
      y: cy,
      vx: (Math.random() - 0.5) * 9,
      vy: (Math.random() - 0.5) * 9,
      alpha: 1,
      size: 4 + Math.random() * 4,
      color: Math.random() < 0.5 ? "#a7f3ff" : "#5ddcff"
    });
  }
}

function updateExplosion() {
  for (let i = explosionParticles.length - 1; i >= 0; i--) {
    const p = explosionParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha *= 0.93;
    if (p.alpha < 0.03) {
      explosionParticles.splice(i, 1);
    }
  }
}

function drawExplosion() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let p of explosionParticles) {
    ctx.fillStyle = p.color.replace(")", `,${p.alpha})`).replace("rgb", "rgba");
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.restore();
}

// ----------------------------------------------------
// Game Over Overlay
// ----------------------------------------------------
function drawGameOver() {
  if (!gameOver) return;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#8af3ff";
  ctx.textAlign = "center";
  ctx.font = "42px system-ui, sans-serif";
  ctx.fillText("DRILLIONS DESTROYED", W / 2, H / 2 - 20);

  ctx.font = "24px system-ui, sans-serif";
  ctx.fillText("Tap anywhere to restart", W / 2, H / 2 + 36);
  ctx.restore();
}

// ----------------------------------------------------
// Main Loop
// ----------------------------------------------------
function loop() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  updateStars();
  drawStars();

  updatePlayer();
  updateParticles();
  drawGhostTrail();
  drawParticles();

  if (logoReady && !gameOver) {
    ctx.drawImage(logo, player.x, player.y, player.w, player.h);
  } else if (logoReady && gameOver) {
    // keep logo visible at final position under explosion
    ctx.drawImage(logo, player.x, player.y, player.w, player.h);
  }

  updateAsteroids();
  drawAsteroids();
  checkAsteroidCollisions();

  updateExplosion();
  drawExplosion();
  drawGameOver();

  requestAnimationFrame(loop);
}
loop();

// ----------------------------------------------------
// Touch Controls (mobile)
// ----------------------------------------------------
canvas.addEventListener("touchstart", handleTouch);
canvas.addEventListener("touchmove", handleTouch);

function handleTouch(e) {
  unlockAudio();

  if (gameOver) {
    // restart whole page for clean reset
    location.reload();
    return;
  }

  accelerate(e);
}

function accelerate(e) {
  e.preventDefault();
  const t = e.touches[0];
  const tx = t.clientX;
  const ty = t.clientY;

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  let dx = tx - cx;
  let dy = ty - cy;
  const d = Math.sqrt(dx * dx + dy * dy);

  if (d > 0) {
    dx /= d;
    dy /= d;
  }

  player.vx += dx * player.tapAccel;
  player.vy += dy * player.tapAccel;

  // little thruster sound
  playSfx(boostSfx);
}
</script>

</body>
</html>
