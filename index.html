<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRILLIONS CRT – MOBILE ARCADE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background:#000; }

  #gameCanvas {
    width: 100vw;
    height: 100vh;
    display: block;
    background: #000;
    touch-action: none;
  }

  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    font-family: system-ui, sans-serif;
    color: #9ff;
    text-shadow: 0 0 6px #0ff;
    z-index: 10;
    font-size: 15px;
  }

  .message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    font-size: 28px;
    font-family: system-ui, sans-serif;
    color: white;
    opacity: 0;
    text-shadow: 0 0 16px cyan;
    transition: opacity .25s;
  }
  .message.show { opacity: 1; }

</style>
</head>
<body>

<div class="hud">
  <div>MODE: <strong>DRILLIONS MOBILE CRT</strong></div>
  <div>SCORE: <span id="scoreValue">0</span></div>
  <div>SPEED: <span id="speedValue">1.0x</span></div>
</div>

<div class="message" id="cornerMsg">PERFECT CORNER! +100</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W,H;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let score = 0;
let paused = false;

const scoreEl = document.getElementById("scoreValue");
const speedEl = document.getElementById("speedValue");
const cornerMsg = document.getElementById("cornerMsg");

const logoImg = new Image();
logoImg.src = "drillions-pixel-logo.png";
let logoLoaded = false;
logoImg.onload = ()=> logoLoaded = true;

const player = {
  x:120, y:120,
  w:300, h:150,
  vx:4, vy:3,
  speedMult:1.0,
  maxMult:3.0
};

// ---- TRAIL SYSTEM ----
const trail = [];

function addTrail(){
  trail.push({
    x:player.x + player.w/2,
    y:player.y + player.h/2,
    r: player.w*0.6,
    alpha:0.45,
    hue: (performance.now()/20)%360
  });
  if(trail.length > 40) trail.shift();
}

function drawTrail(){
  for(const t of trail){
    ctx.beginPath();
    ctx.fillStyle = `hsla(${t.hue},100%,60%,${t.alpha})`;
    ctx.arc(t.x,t.y, t.r/3, 0, Math.PI*2);
    ctx.fill();
    t.alpha -= 0.02;
  }
}

// ---- CRT EFFECT ----
function drawCRTEffects(){
  ctx.save();
  ctx.globalCompositeOperation="multiply";
  ctx.fillStyle="rgba(0,0,0,0.45)";
  for(let y=0;y<H;y+=2){
    ctx.fillRect(0,y,W,1);
  }
  ctx.restore();
}

// ---- CORNER MESSAGE ----
function showCorner(){
  cornerMsg.classList.add("show");
  setTimeout(()=>cornerMsg.classList.remove("show"),300);
}

// ---- UPDATE LOGIC ----
function update(){
  if(!logoLoaded) return;

  player.x += player.vx * player.speedMult;
  player.y += player.vy * player.speedMult;

  let hitX=false, hitY=false;

  if(player.x<=0){ player.x=0; player.vx*=-1; hitX=true;}
  if(player.x+player.w>=W){ player.x=W-player.w; player.vx*=-1; hitX=true;}
  if(player.y<=0){ player.y=0; player.vy*=-1; hitY=true;}
  if(player.y+player.h>=H){ player.y=H-player.h; player.vy*=-1; hitY=true;}

  // scoring
  if(hitX||hitY){
    score+=10;
    player.speedMult=Math.min(player.speedMult+0.015,player.maxMult);
  }

  // corner bonus
  const COR=50;
  if(hitX&&hitY){
    const nearCorner =
      (player.x<COR && player.y<COR) ||
      (player.x+player.w>W-COR && player.y<COR) ||
      (player.x<COR && player.y+player.h>H-COR) ||
      (player.x+player.w>W-COR && player.y+player.h>H-COR);
    if(nearCorner){
      score+=100;
      showCorner();
    }
  }

  // update HUD
  scoreEl.textContent = score;
  speedEl.textContent = player.speedMult.toFixed(1)+"x";
}

// ---- DRAW ----
function draw(){
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.fillRect(0,0,W,H);

  drawTrail();
  if(logoLoaded){
    ctx.drawImage(logoImg,player.x,player.y,player.w,player.h);
  }
  drawCRTEffects();
}

// ---- GAME LOOP ----
function loop(){
  addTrail();
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ---- TOUCH CONTROLS ----
canvas.addEventListener("touchstart", handleTouch);
canvas.addEventListener("touchmove", handleTouch);

function handleTouch(e){
  let touch = e.touches[0];
  let x = touch.clientX;
  let y = touch.clientY;

  // horizontal control
  if(x < W/2) player.vx -= 0.7;
  else player.vx += 0.7;

  // vertical control
  if(y < H/2) player.vy -= 0.7;
  else player.vy += 0.7;
}

// pause on spacebar (desktop)
window.addEventListener("keydown", e=>{
  if(e.code==="Space") paused=!paused;
});
</script>

</body>
</html>
