<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DRILLIONS — CHROME MODE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;}
    canvas{width:100vw;height:100vh;display:block;touch-action:none;}
    #timer{
        position:fixed;top:14px;left:14px;
        color:#8af3ff;font-family:system-ui,sans-serif;
        text-shadow:0 0 6px #00eaff;font-size:17px;z-index:10;
    }
</style>
</head>
<body>

<div id="timer">TIME: 0.0s</div>
<canvas id="gameCanvas"></canvas>

<script>
/* ----------------------------------- */
/* CANVAS */
/* ----------------------------------- */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let W, H;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
resize();
addEventListener("resize", resize);

/* ----------------------------------- */
/* ASSETS */
/* ----------------------------------- */
const logo = new Image();
logo.src = "drillions-pixel-logo.png";

/* ----------------------------------- */
/* PLAYER */
/* ----------------------------------- */
const player = {
    x: 150,
    y: 150,
    w: 160,     // smaller, perfect touch size
    h: 80,
    vx: 0,
    vy: 0,
    drag: 0.90, // smoother slow-down
    tapAccel: 1.8,
    maxSpeed: 7
};

/* ----------------------------------- */
/* STARS */
/* ----------------------------------- */
let stars=[];
function initStars(){
    stars=[];
    for(let i=0;i<220;i++){
        stars.push({
            x:Math.random()*W,
            y:Math.random()*H,
            s:Math.random()*2+0.5,
            sp:Math.random()*0.7+0.2
        });
    }
}
initStars();

function updateStars(){
    for(let s of stars){
        s.y+=s.sp;
        if(s.y>H){s.y=-5;s.x=Math.random()*W;}
    }
}

function drawStars(){
    ctx.fillStyle="#8af3ff";
    ctx.globalAlpha=0.55;
    for(let s of stars) ctx.fillRect(s.x,s.y,s.s,s.s);
    ctx.globalAlpha=1;
}

/* ----------------------------------- */
/* UPDATE PLAYER */
/* ----------------------------------- */
function updatePlayer(){
    // apply drag
    player.vx*=player.drag;
    player.vy*=player.drag;

    // clamp speed
    const sp=Math.sqrt(player.vx**2+player.vy**2);
    if(sp>player.maxSpeed){
        let f=player.maxSpeed/sp;
        player.vx*=f; player.vy*=f;
    }

    player.x+=player.vx;
    player.y+=player.vy;

    // borders
    if(player.x<0) player.x=0;
    if(player.y<0) player.y=0;
    if(player.x+player.w>W) player.x=W-player.w;
    if(player.y+player.h>H) player.y=H-player.h;
}

function drawPlayer(){
    ctx.drawImage(logo, player.x, player.y, player.w, player.h);
}

/* ----------------------------------- */
/* ASTEROIDS */
/* ----------------------------------- */
const asteroids=[];
function spawn(){
    asteroids.push({
        x:Math.random()*(W-40),
        y:-60,
        s:40,           // slightly smaller
        sp:2.6+Math.random()*1.4
    });
}
setInterval(spawn,900);

function updateAsteroids(){
    for(let a of asteroids) a.y+=a.sp;
}

function drawAsteroids(){
    ctx.imageSmoothingEnabled=false;
    for(let a of asteroids){
        ctx.fillStyle="#444";
        ctx.fillRect(a.x,a.y,a.s,a.s);
        ctx.fillStyle="#777";
        ctx.fillRect(a.x+6,a.y+6,a.s-12,a.s-12);
    }
}

/* ----------------------------------- */
/* COLLISION */
/* ----------------------------------- */
let dead=false;

function checkHit(){
    for(let a of asteroids){
        if(
            player.x < a.x+a.s &&
            player.x+player.w > a.x &&
            player.y < a.y+a.s &&
            player.y+player.h > a.y
        ){
            dead=true;
        }
    }
}

/* ----------------------------------- */
/* TIMER */
/* ----------------------------------- */
let startTime=performance.now();
let elapsed=0;

/* ----------------------------------- */
/* TOUCH CONTROL (smooth spaceship) */
/* ----------------------------------- */
canvas.addEventListener("touchstart", move);
canvas.addEventListener("touchmove", move);

function move(e){
    if(dead) return;
    const t=e.touches[0];
    const tx=t.clientX;
    const ty=t.clientY;

    const cx=player.x+player.w/2;
    const cy=player.y+player.h/2;

    let dx=tx-cx;
    let dy=ty-cy;

    let d=Math.sqrt(dx*dx+dy*dy);
    if(d>0){dx/=d;dy/=d;}

    player.vx += dx * player.tapAccel;
    player.vy += dy * player.tapAccel;
}

/* ----------------------------------- */
/* LOOP */
/* ----------------------------------- */
function loop(){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);

    updateStars();
    drawStars();

    if(!dead){
        elapsed = (performance.now()-startTime)/1000;
        document.getElementById("timer").innerText =
          "TIME: " + elapsed.toFixed(1)+"s";
    }

    if(!dead){
        updatePlayer();
        drawPlayer();

        updateAsteroids();
        drawAsteroids();

        checkHit();
    }

    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
