<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DRILLIONS TEST</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  canvas { width:100vw; height:100vh; display:block; background:#111; }
  h1 {
    position:fixed;
    top:20px; left:20px;
    color:#0ff;
    font-family:Arial;
    text-shadow:0 0 10px #0ff;
  }
</style>
</head>
<body>

<h1>DRILLIONS TEST MODE</h1>
<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize() {
  c.width = innerWidth;
  c.height = innerHeight;
}
resize();
addEventListener("resize", resize);

// Load player logo (with force refresh)
const logo = new Image();
logo.src = "drillions-pixel-logo.png?v=" + Date.now();

let logoReady = false;
logo.onload = () => {
  logoReady = true;
  console.log("LOGO LOADED");
};
logo.onerror = () => {
  console.error("LOGO FAILED TO LOAD");
};

function loop() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle = "#0ff";
  ctx.font = "32px Arial";
  ctx.fillText("If you see the logo, everything works.", 40, 100);

  if (logoReady) {
    ctx.drawImage(logo, 100, 150, 300, 150);
  } else {
    ctx.fillStyle = "#f00";
    ctx.fillText("LOGO NOT READY…", 40, 200);
  }

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
