<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRILLIONS – SURVIVAL MODE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  #gameCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; }

  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    font-family: system-ui, sans-serif;
    color: #8af3ff;
    text-shadow: 0 0 6px #00eaff;
    font-size: 17px;
    z-index: 20;
    display: none;
  }

  /* Start Menu */
  #startMenu {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 50;
    color: #8af3ff;
    text-shadow: 0 0 8px #00eaff;
    font-family: system-ui, sans-serif;
  }

  #startBtn {
    padding: 12px 28px;
    border: 2px solid #8af3ff;
    background: transparent;
    color: #8af3ff;
    font-size: 22px;
    border-radius: 8px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<!-- HUD -->
<div class="hud" id="hudTimer">Time: 0.0</div>

<!-- Start Menu -->
<div id="startMenu">
  <h1 style="font-size:34px;">DRILLIONS</h1>
  <p style="opacity:0.8">Chrome Survival Mode</p>
  <button id="startBtn">START DRILLIONS</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// ---------------------------------------------------------------------
// BASIC SETUP
// ---------------------------------------------------------------------
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ---------------------------------------------------------------------
// ASSETS (you must upload explode.mp3 + boost.mp3)
// ---------------------------------------------------------------------
const explodeSFX = new Audio("explode.mp3");
const boostSFX = new Audio("boost.mp3");
boostSFX.volume = 0.5;

// Player logo
const logo = new Image();
logo.src = "drillions-pixel-logo.png?v=" + Date.now();
let logoReady = false;
logo.onload = () => logoReady = true;

// ---------------------------------------------------------------------
// PLAYER
// ---------------------------------------------------------------------
const player = {
  x: 200, y: 200,
  w: 260, h: 130,
  vx: 0, vy: 0,
  accel: 0.35,
  maxSpeed: 9,
  drag: 0.92
};

// ---------------------------------------------------------------------
// GHOST TRAIL
// ---------------------------------------------------------------------
const ghosts = [];
const MAX_GHOSTS = 7;

// ---------------------------------------------------------------------
// ASTEROIDS
// ---------------------------------------------------------------------
const asteroids = [];
let GAME_STARTED = false;
let GAME_OVER = false;

// ---------------------------------------------------------------------
// TIMER
// ---------------------------------------------------------------------
let startTime = 0;
let survivalTime = 0;
const hudTimer = document.getElementById("hudTimer");

// ---------------------------------------------------------------------
// STARFIELD
// ---------------------------------------------------------------------
const STAR_COUNT = 150;
let stars = [];
function initStars() {
  stars = [];
  for (let i=0;i<STAR_COUNT;i++) {
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      speed: Math.random()*0.7 + 0.2,
      size: Math.random()*2 + 0.5
    });
  }
}
initStars();

function drawStars() {
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "#8af3ff";
  for (let s of stars) {
    ctx.fillRect(s.x, s.y, s.size, s.size);
    s.y += s.speed;
    if (s.y > H) { s.y = -5; s.x = Math.random()*W; }
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------
// START GAME LOGIC
// ---------------------------------------------------------------------
document.getElementById("startBtn").onclick = () => {
  document.getElementById("startMenu").style.display = "none";
  hudTimer.style.display = "block";
  GAME_STARTED = true;
  startTime = performance.now();
};

// ---------------------------------------------------------------------
// ASTEROID SPAWN
// ---------------------------------------------------------------------
setInterval(() => {
  if (!GAME_STARTED || GAME_OVER) return;
  asteroids.push({
    x: Math.random() * (W - 60),
    y: -80,
    size: 55,
    speed: 3 + Math.random()*2
  });
}, 1100);

// ---------------------------------------------------------------------
// GAME LOOP
// ---------------------------------------------------------------------
function loop() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,W,H);

  drawStars();

  if (GAME_STARTED && !GAME_OVER) updatePlayer();
  if (GAME_STARTED && !GAME_OVER) updateAsteroids();
  if (GAME_STARTED && !GAME_OVER) checkCollision();

  if (GAME_STARTED) drawPlayer();
  drawGhosts();
  drawAsteroids();

  if (GAME_STARTED && !GAME_OVER) updateTimer();
  if (GAME_OVER) drawGameOver();

  requestAnimationFrame(loop);
}
loop();

// ---------------------------------------------------------------------
// PLAYER MOVEMENT
// ---------------------------------------------------------------------
function updatePlayer() {
  player.vx *= player.drag;
  player.vy *= player.drag;

  player.x += player.vx;
  player.y += player.vy;

  // Boundaries
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > W) player.x = W - player.w;
  if (player.y < 0) player.y = 0;
  if (player.y + player.h > H) player.y = H - player.h;

  // Ghost trail
  ghosts.unshift({x: player.x, y: player.y});
  if (ghosts.length > MAX_GHOSTS) ghosts.pop();
}

function drawPlayer() {
  if (logoReady) ctx.drawImage(logo, player.x, player.y, player.w, player.h);
}

function drawGhosts() {
  if (!logoReady) return;
  for (let i=0;i<ghosts.length;i++) {
    const g = ghosts[i];
    const alpha = (i+1)/ghosts.length * 0.18;
    ctx.globalAlpha = alpha;
    ctx.drawImage(logo, g.x, g.y, player.w, player.h);
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------
// TOUCH CONTROLS (smooth analog movement)
// ---------------------------------------------------------------------
canvas.addEventListener("touchmove", (e) => {
  if (!GAME_STARTED || GAME_OVER) return;
  const t = e.touches[0];
  const dx = t.clientX - (player.x + player.w/2);
  const dy = t.clientY - (player.y + player.h/2);
  const dist = Math.sqrt(dx*dx + dy*dy);

  if (dist > 0) {
    player.vx += (dx/dist) * player.accel;
    player.vy += (dy/dist) * player.accel;
    boostSFX.play();
  }
});

// ---------------------------------------------------------------------
// ASTEROIDS
// ---------------------------------------------------------------------
function updateAsteroids() {
  for (let a of asteroids) {
    a.y += a.speed;
  }
}

function drawAsteroids() {
  ctx.fillStyle = "#444";
  for (let a of asteroids) {
    ctx.fillRect(a.x, a.y, a.size, a.size);
    ctx.fillStyle="#777";
    ctx.fillRect(a.x+10, a.y+10, a.size-20, a.size-20);
  }
}

// ---------------------------------------------------------------------
// COLLISION
// ---------------------------------------------------------------------
function checkCollision() {
  for (let a of asteroids) {
    if (
      player.x < a.x + a.size &&
      player.x + player.w > a.x &&
      player.y < a.y + a.size &&
      player.y + player.h > a.y
    ) {
      GAME_OVER = true;
      explodeSFX.play();
    }
  }
}

// ---------------------------------------------------------------------
// TIMER
// ---------------------------------------------------------------------
function updateTimer() {
  const now = performance.now();
  survivalTime = (now - startTime) / 1000;
  hudTimer.innerText = "Time: " + survivalTime.toFixed(1);
}

// ---------------------------------------------------------------------
// GAME OVER
// ---------------------------------------------------------------------
function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#8af3ff";
  ctx.textAlign = "center";
  ctx.font = "40px system-ui";
  ctx.fillText("DRILLIONS DESTROYED", W/2, H/2 - 20);
  ctx.font = "22px system-ui";
  ctx.fillText("Score: " + survivalTime.toFixed(1) + "s", W/2, H/2 + 20);
  ctx.fillText("Tap to Restart", W/2, H/2 + 70);
}

canvas.addEventListener("touchstart", () => {
  if (GAME_OVER) location.reload();
});

</script>
</body>
</html>
