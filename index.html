<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRILLIONS – CHROME MODE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
  #hud {
    position: fixed;
    top: 14px;
    left: 14px;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    color: #8af3ff;
    text-shadow: 0 0 6px #00eaff;
    z-index: 20;
  }
</style>
</head>
<body>

<div id="hud">DRILLIONS – CHROME MODE</div>
<canvas id="game"></canvas>

<script>
// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ============================================================
// PLAYER LOGO
// ============================================================
const logo = new Image();
logo.src = "drillions-pixel-logo.png";
let logoReady = false;
logo.onload = () => logoReady = true;

// ============================================================
// PLAYER — always drifts, boost adds force
// ============================================================
const player = {
  x: 200,
  y: 200,
  w: 240,
  h: 110,
  vx: 200,     // base drift so movement NEVER stops
  vy: 160,
  accelBoost: 900,
  maxSpeed: 900,
  drag: 0.985  // light drag → smooth float
};

// ============================================================
// STARFIELD
// ============================================================
const STAR_COUNT = 180;
let stars = [];

function initStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.8 + 0.4
    });
  }
}
initStars();

// ============================================================
// UPDATE PLAYER — smooth drifting
// ============================================================
function updatePlayer(dt) {
  // apply drag
  player.vx *= player.drag;
  player.vy *= player.drag;

  // cap speed
  const speed = Math.hypot(player.vx, player.vy);
  if (speed > player.maxSpeed) {
    const scale = player.maxSpeed / speed;
    player.vx *= scale;
    player.vy *= scale;
  }

  // movement
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // bounce screen edges
  if (player.x < 0) { player.x = 0; player.vx = Math.abs(player.vx); }
  if (player.y < 0) { player.y = 0; player.vy = Math.abs(player.vy); }

  if (player.x + player.w > canvas.width) {
    player.x = canvas.width - player.w;
    player.vx = -Math.abs(player.vx);
  }
  if (player.y + player.h > canvas.height) {
    player.y = canvas.height - player.h;
    player.vy = -Math.abs(player.vy);
  }

  if (logoReady) {
    ctx.drawImage(logo, player.x, player.y, player.w, player.h);
  }
}

// ============================================================
// TOUCH BOOST — NOT the only movement
// ============================================================
function boost(e) {
  e.preventDefault();

  const t = e.touches[0];
  const tx = t.clientX;
  const ty = t.clientY;

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  let dx = tx - cx;
  let dy = ty - cy;

  const d = Math.hypot(dx, dy);
  if (d > 0) {
    dx /= d;
    dy /= d;
  }

  // add BOOST to the drift
  player.vx += dx * player.accelBoost * 0.015;
  player.vy += dy * player.accelBoost * 0.015;
}

canvas.addEventListener("touchstart", boost);
canvas.addEventListener("touchmove", boost);

// ============================================================
// MAIN LOOP — delta-time smooth
// ============================================================
let last = 0;

function loop(t) {
  requestAnimationFrame(loop);
  let dt = (t - last) / 1000;
  if (dt > 0.05) dt = 0.05;
  last = t;

  // clear
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // stars
  for (let s of stars) {
    s.y += s.speed;
    if (s.y > canvas.height) {
      s.y = -3;
      s.x = Math.random() * canvas.width;
    }
    ctx.fillStyle = "#8af3ff";
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  // player
  updatePlayer(dt);
}

loop();
</script>

</body>
</html>
