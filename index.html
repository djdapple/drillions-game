<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRILLIONS – Chrome Trails Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #gameCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
  </style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<script>
// Canvas
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize(){
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

// Load logo
const logo = new Image();
logo.src = "drillions-pixel-logo.png?v=" + Date.now();
let ready = false;
logo.onload = () => ready = true;

// Player
const p = {
  x: 120,
  y: 120,
  w: 260,
  h: 130,
  vx: 4,
  vy: 4,
  minSpeed: 3,
  maxSpeed: 10,
  drag: 0.94,
  accel: 2
};

// Chrome trail
const trail = [];
const MAX_TRAIL = 40;

// Update physics
function update(){
  p.vx *= p.drag;
  p.vy *= p.drag;

  let speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
  if(speed < p.minSpeed){
    const f = p.minSpeed / speed;
    p.vx *= f;
    p.vy *= f;
  }
  if(speed > p.maxSpeed){
    const f = p.maxSpeed / speed;
    p.vx *= f;
    p.vy *= f;
  }

  p.x += p.vx;
  p.y += p.vy;

  if(p.x <= 0 || p.x + p.w >= W) p.vx *= -1;
  if(p.y <= 0 || p.y + p.h >= H) p.vy *= -1;

  p.x = Math.min(Math.max(p.x,0), W - p.w);
  p.y = Math.min(Math.max(p.y,0), H - p.h);

  const cx = p.x + p.w/2;
  const cy = p.y + p.h/2;

  trail.unshift({ x: cx, y: cy });
  if(trail.length > MAX_TRAIL) trail.pop();
}

// Draw chrome trail
function drawTrail(){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for(let i=0;i<trail.length-1;i++){
    const a = trail[i];
    const b = trail[i+1];
    const t = 1 - i / trail.length;
    
    ctx.lineWidth = 6 * t;
    ctx.strokeStyle = `rgba(120,200,255,${0.15*t})`;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  ctx.restore();
}

// Draw player
function drawPlayer(){
  if(!ready) return;
  ctx.drawImage(logo, p.x, p.y, p.w, p.h);
}

// Loop
function loop(){
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,W,H);

  update();
  drawTrail();
  drawPlayer();

  requestAnimationFrame(loop);
}
loop();

// Touch accel
canvas.addEventListener("touchstart", accelerate);
canvas.addEventListener("touchmove", accelerate);

function accelerate(e){
  e.preventDefault();
  const t = e.touches[0];
  const tx = t.clientX;
  const ty = t.clientY;

  const cx = p.x + p.w/2;
  const cy = p.y + p.h/2;

  let dx = tx - cx;
  let dy = ty - cy;

  const d = Math.sqrt(dx*dx + dy*dy);
  if(d > 0){
    dx /= d;
    dy /= d;
  }

  p.vx += dx * p.accel;
  p.vy += dy * p.accel;
}
</script>

</body>
</html>
