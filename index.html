<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DRILLIONS DEBUG MODE</title>
<style>
  body { margin:0; background:#000; color:#0ff; font-family:Arial; }
  #errorBox {
    white-space:pre-wrap;
    padding:20px;
    font-size:18px;
    color:#0ff;
  }
</style>
</head>
<body>

<div id="errorBox">DEBUG: Loading…</div>
<canvas id="game"></canvas>

<script>
const errorBox = document.getElementById("errorBox");

// FORCE error catch globally
window.onerror = function(msg, url, line, col, err) {
  errorBox.textContent += `\n\n❌ ERROR:\n${msg}\nLine: ${line}\n${err}`;
};

// Canvas setup
try {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
  }
  resize();

  // Load image
  const img = new Image();
  img.src = "drillions-pixel-logo.png?v=" + Date.now();
  img.onload = () => {
    errorBox.textContent += "\n\nImage loaded ✔️";
  };
  img.onerror = () => {
    errorBox.textContent += "\n\n❌ IMAGE FAILED TO LOAD";
  };

  function loop(){
    try {
      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 50, 50, 200, 100);
    } catch (e) {
      errorBox.textContent += "\n\n❌ LOOP ERROR:\n" + e.message;
    }
    requestAnimationFrame(loop);
  }
  loop();
} catch(e){
  errorBox.textContent += "\n\n❌ SETUP ERROR:\n" + e.message;
}
</script>

</body>
</html>
