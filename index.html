<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DRILLIONS TEST ENGINE</title>
<style>
  html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
  }
  canvas {
      width: 100vw;
      height: 100vh;
      display: block;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
// --------------------------------------------------
// BASIC CANVAS SETUP (Guaranteed to work)
// --------------------------------------------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// --------------------------------------------------
// TEST LOGO
// --------------------------------------------------
const img = new Image();
img.src = "drillions-pixel-logo.png?v=" + Date.now();
let ready = false;

img.onload = () => ready = true;

// --------------------------------------------------
// PERFECTLY SAFE LOOP
// --------------------------------------------------
function loop() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (ready) {
        ctx.drawImage(img, canvas.width/2 - 150, canvas.height/2 - 75, 300, 150);
    }

    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
