<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRILLIONS CRT – MOBILE ARCADE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background:#000; }

  #gameCanvas {
    width: 100vw;
    height: 100vh;
    display: block;
    background: #000;
    touch-action: none;
  }

  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    font-family: system-ui, sans-serif;
    color: #9ff;
    text-shadow: 0 0 6px #0ff;
    z-index: 10;
    font-size: 15px;
  }

  .message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    font-size: 28px;
    font-family: system-ui, sans-serif;
    color: white;
    opacity: 0;
    text-shadow: 0 0 16px cyan;
    transition: opacity .25s;
    z-index: 20;
  }
  .message.show { opacity: 1; }

</style>
</head>
<body>

<div class="hud">
  <div>MODE: <strong>DRILLIONS MOBILE CRT</strong></div>
  <div>SCORE: <span id="scoreValue">0</span></div>
  <div>SPEED: <span id="speedValue">1.0x</span></div>
</div>

<div class="message" id="cornerMsg">PERFECT CORNER! +100</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let score = 0;
let paused = false;
const scoreEl = document.getElementById("scoreValue");
const speedEl = document.getElementById("speedValue");
const cornerMsg = document.getElementById("cornerMsg");

// Load logo
const logoImg = new Image();
logoImg.src = "drillions-pixel-logo.png";
let logoLoaded = false;
logoImg.onload = () => logoLoaded = true;

// Player
const player = {
  x:120, y:120,
  w:300, h:150,
  vx:4, vy:3,
  speedMult:1.0,
  maxMult:3.0
};

// Trail system
const trail = [];
function addTrail(){
  trail.push({
    x: player.x + player.w/2,
    y: player.y + player.h/2,
    r: player.w * 0.55,
    alpha: 0.45,
    hue: (performance.now()/12) % 360
  });
  if(trail.length > 35) trail.shift();
}

function drawTrail(){
  for(const t of trail){
    ctx.beginPath();
    ctx.fillStyle = `hsla(${t.hue},100%,60%,${t.alpha})`;
    ctx.arc(t.x, t.y, t.r/3, 0, Math.PI*2);
    ctx.fill();
    t.alpha -= 0.02;
  }
}

// CRT scanlines + glow
function drawCRTEffects(){
  ctx.save();
  ctx.globalCompositeOperation="multiply";
  ctx.fillStyle="rgba(0,0,0,0.5)";
  for(let y=0; y<H; y+=2){
    ctx.fillRect(0,y,W,1);
  }
  ctx.restore();

  // Vignette
  ctx.save();
  const v = ctx.createRadialGradient(
    W/2,H/2, Math.min(W,H)*0.4,
    W/2,H/2, Math.max(W,H)*0.75
  );
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(0,0,0,0.75)");
  ctx.fillStyle = v;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function showCorner(){
  cornerMsg.classList.add("show");
  setTimeout(()=>cornerMsg.classList.remove("show"),300);
}

// Update physics
function update(){
  if(!logoLoaded || paused) return;

  player.x += player.vx * player.speedMult;
  player.y += player.vy * player.speedMult;

  let hitX = false, hitY = false;

  // Bounce collisions
  if(player.x <= 0){ player.x = 0; player.vx *= -1; hitX=true; }
  if(player.x + player.w >= W){ player.x = W-player.w; player.vx *= -1; hitX=true; }
  if(player.y <= 0){ player.y = 0; player.vy *= -1; hitY=true; }
  if(player.y + player.h >= H){ player.y = H-player.h; player.vy *= -1; hitY=true; }

  // Score
  if(hitX||hitY){
    score += 10;
    player.speedMult = Math.min(player.speedMult + 0.015, player.maxMult);
  }

  // Corner jackpot
  const COR = 50;
  if(hitX && hitY){
    const corner =
      (player.x < COR && player.y < COR) ||
      (player.x + player.w > W-COR && player.y < COR) ||
      (player.x < COR && player.y + player.h > H-COR) ||
      (player.x + player.w > W-COR && player.y + player.h > H-COR);

    if(corner){
      score += 100;
      showCorner();
    }
  }

  scoreEl.textContent = score;
  speedEl.textContent = player.speedMult.toFixed(1)+"x";
}

// Draw
function draw(){
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.fillRect(0,0,W,H);

  drawTrail();

  if(logoLoaded){
    ctx.drawImage(logoImg, player.x, player.y, player.w, player.h);
  }

  drawCRTEffects();
}

// Game loop
function loop(){
  addTrail();
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ---- TAP-TO-MOVE (True Direction Control) ----
canvas.addEventListener("touchstart", moveTowardTap);
canvas.addEventListener("touchmove", moveTowardTap);

function moveTowardTap(e){
  e.preventDefault();
  let touch = e.touches[0];
  let tx = touch.clientX;
  let ty = touch.clientY;

  // center of logo
  let cx = player.x + player.w/2;
  let cy = player.y + player.h/2;

  let dx = tx - cx;
  let dy = ty - cy;

  let length = Math.sqrt(dx*dx + dy*dy);
  if(length > 0){
    dx /= length;
    dy /= length;
  }

  player.vx = dx * 6;
  player.vy = dy * 6;
}

// Pause on spacebar (desktop)
window.addEventListener("keydown", e=>{
  if(e.code==="Space") paused=!paused;
});
</script>

</body>
</html>
